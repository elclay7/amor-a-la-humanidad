name: Deploy web

on:
  push:
    branches:
      - main

concurrency:
  group: amor-a-la-humanidad-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, ia]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rsync html to homelab
        env:
          DEPLOY_HOST: 192.168.1.7
          DEPLOY_USER: clay
          DEPLOY_PATH: /storage/webservices/amor
        run: |
          rsync -az --delete --chmod=F644,D755 html/ "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/html/"
          ssh "$DEPLOY_USER@$DEPLOY_HOST" "test -s $DEPLOY_PATH/html/index.html && echo HTML_OK"
